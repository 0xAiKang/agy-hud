      <tspan class="t-gray"> │ </tspan>
      <tspan class="t-yellow">Antigravity</tspan>
      <tspan class="t-gray"> │ </tspan>
      <tspan class="t-white">调研开发 agy-hud</tspan>
      <tspan class="t-gray"> │ </tspan>
      <tspan class="t-dim">⏱ 48m</tspan>
      <tspan class="t-gray"> │ </tspan>
      <tspan class="t-dim">Cost </tspan><tspan class="t-green">~$0.04</tspan>
    </text>

    <!-- Line 2: Context & Quotas -->
    <text y="32">
      <tspan class="t-white">🧠 Context </tspan>
      <tspan class="t-bar-fill">█</tspan><tspan class="t-bar-empty">░░░░░░░░░</tspan>
      <tspan class="t-white"> 14.0% (147k/1.05M)</tspan>
      <tspan class="t-gray"> │ </tspan>
      <tspan class="t-white">⏳ 5h: </tspan><tspan class="t-green">94%</tspan><tspan class="t-gray"> (4h 30m)</tspan>
      <tspan class="t-gray"> │ </tspan>
      <tspan class="t-white">📅 Wk: </tspan><tspan class="t-green">98%</tspan><tspan class="t-gray"> (6d 0h)</tspan>
    </text>

    <!-- Line 3: Assets -->
    <text y="64">
      <tspan class="t-yellow">⚡ 1 AGENTS.md</tspan>
      <tspan class="t-gray"> │ </tspan>
      <tspan class="t-cyan">1 MCP (river-memory)</tspan>
      <tspan class="t-gray"> │ </tspan>
      <tspan class="t-magenta">93 Skills</tspan>
      <tspan class="t-gray"> │ </tspan>
      <tspan class="t-green">🛡️ bypass permissions on</tspan>
    </text>

    <!-- Line 4: Tools -->
    <text y="96">
      <tspan class="t-white">🔧 </tspan>
      <tspan class="t-green">✓</tspan><tspan class="t-white"> Bash </tspan><tspan class="t-gray">×43</tspan>
      <tspan class="t-gray"> │ </tspan>
      <tspan class="t-green">✓</tspan><tspan class="t-white"> View </tspan><tspan class="t-gray">×10</tspan>
      <tspan class="t-gray"> │ </tspan>
      <tspan class="t-green">✓</tspan><tspan class="t-white"> Edit </tspan><tspan class="t-gray">×5</tspan>
      <tspan class="t-gray"> │ </tspan>
      <tspan class="t-green">✓</tspan><tspan class="t-white"> Web </tspan><tspan class="t-gray">×1</tspan>
      <tspan class="t-gray"> │ </tspan>
      <tspan class="t-cyan">🎯 Skills: ak-skills-update, agy-customizations</tspan>
    </text>

    <!-- Line 5: Tokens -->
    <text y="128">
      <tspan class="t-white">📊 Tokens: 147k </tspan>
      <tspan class="t-dim">(in: 3.4k, out: 680, cache: 92.1k · </tspan><tspan class="t-green">96.4% hit</tspan><tspan class="t-dim">)</tspan>
    </text>
