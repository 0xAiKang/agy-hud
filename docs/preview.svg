<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f141c; rx: 12px; }
      .titlebar { fill: #161d27; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .title-text { fill: #7d8b99; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .code { font-family: "JetBrains Mono", "SF Mono", "Fira Code", Menlo, Monaco, monospace; font-size: 14px; line-height: 24px; }
      .t-cyan { fill: #00e5ff; font-weight: bold; }
      .t-magenta { fill: #d946ef; }
      .t-yellow { fill: #eab308; }
      .t-green { fill: #22c55e; }
      .t-gray { fill: #64748b; }
      .t-white { fill: #f8fafc; }
      .t-dim { fill: #94a3b8; }
      .t-bar-fill { fill: #22c55e; }
      .t-bar-empty { fill: #334155; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="940" height="260" class="bg" />

  <!-- Titlebar -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 928 0 C 934.627 0 940 5.373 940 12 L 940 38 L 0 38 Z" class="titlebar" />
  <circle cx="20" cy="19" r="6" class="dot-red" />
  <circle cx="40" cy="19" r="6" class="dot-yellow" />
  <circle cx="60" cy="19" r="6" class="dot-green" />
  <text x="470" y="24" text-anchor="middle" class="title-text">Antigravity CLI — agy-hud statusline</text>

